_subdirectory: skeleton
_answers_file: .copier-answers.yml

# Instance-owned скаффолд: приезжает при ПЕРВОМ copy, при `copier update`
# существующий файл НЕ перезаписывается — это файлы инстанса, шаблон даёт
# только стартовое состояние (fail-open, работает из коробки).
_skip_if_exists:
  - ".harness.conf"
  - ".claude/settings.json"
  - "CLAUDE.md"
  - ".gitignore"
  - "scripts/load-context.sh"
  - "scripts/verify-harness.sh"
  # Языковые правила — стартер, инстанс их дорабатывает под себя (сужает paths:
  # под свою раскладку, добавляет проектные пункты). Обновления пака не форсим.
  - ".claude/rules/lang/*.md"

_exclude:
  # ВНИМАНИЕ: это blacklist, не whitelist (Copier не поддерживает re-include после "*").
  # Новый НЕ-CORE файл в skeleton/ просочится в инстанс, пока не добавлен сюда.
  # После добавления файлов в skeleton — сверяйся с CORE_PATHS (scripts/lib/layers.sh).
  # Готовая проверка обоих условий (CORE доехал, лишнее не протекло): scripts/verify-copier.sh.
  # Руками:
  #   copier copy --vcs-ref HEAD --data project_name=probe --data lang=vue . /tmp/probe \
  #     --defaults --trust && find /tmp/probe -type f
  # `--vcs-ref HEAD` обязателен: без него Copier для git-шаблона рендерит последний ТЕГ, а не
  # текущее состояние, и новых файлов в выводе просто нет. С ним и с локальным путём рендерится
  # РАБОЧЕЕ ДЕРЕВО, включая untracked-файлы и незакоммиченный `_exclude` — проверено прогоном,
  # клон для этого не нужен.
  # `--data project_name=` не опционален: без обязательного ответа рендер падает, а с
  # подавленным stderr пустой каталог читается как «прошло, файлов нет».
  # Non-CORE skeleton files — template scaffolding
  - "*.template"
  - "lang-packs"
  # `scripts` целиком исключать нельзя: log-append / check-ac-refs / load-context — CORE,
  # на них ссылаются правила и settings.json. Глухое исключение давало пять битых ссылок.
  - ".husky"
  - ".harness.conf.example"

  # Non-CORE .claude subdirs
  - ".claude/docs"
  - ".claude/settings.json.template"
  # Роли-агенты — instance-owned scaffold (ADR-13). Copier их НЕ доставляет ни при init,
  # ни при update: раскатка только явным флагом `bootstrap.sh <имя> <lang> --agents`.
  # Причина — агент завязан на стек и базу знаний проекта (доказано боевым инстансом),
  # форс-синк ломал бы инстанс, а пустой плейсхолдер в каждом репо вреднее явного принятия.
  - ".claude/agents"

  # Пак доставляется, если выбран как основной (lang) ИЛИ как дополнительный
  # (extra_langs) — монорепе нужно несколько сразу: python для бэкенда,
  # react для фронта. Почему не мультивыбор в самом lang: copier парсит ответ
  # ДО рендера шаблонов, и мультивыбор роняет существующие инстансы со строковым
  # ответом (`lang: python` → "Not a YAML list"). Отдельный вопрос обратно совместим.

  # md-libs lang file is not a standard LANG pack
  - ".claude/rules/lang/md-libs.md"

  # Exclude each lang file that is NOT selected (neither primary nor extra)
  - "{% if lang != 'vue' and 'vue' not in extra_langs %}.claude/rules/lang/vue.md{% endif %}"
  - "{% if lang != 'go' and 'go' not in extra_langs %}.claude/rules/lang/go.md{% endif %}"
  - "{% if lang != 'php' and 'php' not in extra_langs %}.claude/rules/lang/php.md{% endif %}"
  - "{% if lang != 'python' and 'python' not in extra_langs %}.claude/rules/lang/python.md{% endif %}"
  - "{% if lang != 'react' and 'react' not in extra_langs %}.claude/rules/lang/react.md{% endif %}"
  - "{% if lang != 'dotnet' and 'dotnet' not in extra_langs %}.claude/rules/lang/dotnet.md{% endif %}"

project_name:
  type: str
  help: Имя проекта-инстанса

lang:
  type: str
  help: Основной языковой пак
  choices: [vue, react, go, php, python, dotnet, none]
  default: vue

extra_langs:
  type: str
  multiselect: true
  help: Дополнительные паки — для монорепы (напр. react поверх python). Обычный проект — пусто.
  choices: [vue, react, go, php, python]
  default: []
